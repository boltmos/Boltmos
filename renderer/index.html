<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boltmos</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100%;
      height: 100%;
    }

    body {
      -webkit-app-region: drag;
    }

    #character-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      -webkit-app-region: no-drag;
    }

    #speech-bubble {
      display: none;
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #333;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      max-width: 220px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
    }

    #chat-container {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    #mic-button {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
    }

    #mic-button.mic-active {
      background: #e53935;
      color: white;
      animation: mic-pulse 1s ease-in-out infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.6); }
      50% { box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
    }

    #chat-input {
      box-sizing: border-box;
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border: none;
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-size: 13px;
      font-family: Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
    }

    #chat-error {
      display: none;
      position: absolute;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 340px;
      background: rgba(229, 57, 53, 0.95);
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-family: Arial, sans-serif;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
  </style>

  <!--
    Electron renderer runs with nodeIntegration: false / contextIsolation: true,
    so it behaves like a plain browser page. "three" and "@pixiv/three-vrm" use
    bare module specifiers internally (e.g. `import * as THREE from "three"`),
    which the browser's ES module resolver cannot resolve on its own. This
    import map tells it where those bare specifiers point on disk, resolved
    relative to this HTML file's location (renderer/index.html).
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="character-canvas"></canvas>
  <div id="speech-bubble"></div>
  <div id="chat-error"></div>
  <div id="chat-container">
    <button id="mic-button" type="button" aria-label="Voice input">🎤</button>
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
  </div>

  <script type="module" src="./renderer.js"></script>

  <script>
    const speechBubble = document.getElementById('speech-bubble');
    let speechTimeout = null;

    window.showSpeech = function showSpeech(text, duration = 3000) {
      speechBubble.textContent = text;
      speechBubble.style.display = 'block';

      if (speechTimeout) {
        clearTimeout(speechTimeout);
      }

      speechTimeout = setTimeout(() => {
        speechBubble.style.display = 'none';
        speechTimeout = null;
      }, duration);
    };
  </script>
</body>
</html>
