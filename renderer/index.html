<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boltmos</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      width: 100%;
      height: 100%;
    }

    body {
      -webkit-app-region: drag;
    }

    #character-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent;
      -webkit-app-region: no-drag;
    }

    #speech-bubble {
      display: none;
      position: absolute;
      /* top is set dynamically in renderer.js (positionSpeechBubble()),
         tracked to the character's actual projected head position each
         frame - see the identical rationale on #chat-container above. This
         is a fallback only, used before the first camera frame has run. */
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #333;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      max-width: 220px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
    }

    #chat-container {
      display: none;
      position: absolute;
      /* top is set dynamically in renderer.js (positionChatContainer()),
         tracked to the character's actual projected feet position each
         frame - the window is desktop-sized, so a fixed offset can't stay
         near her regardless of her height/zoom/framing. This is a fallback
         only, used before the first camera frame has run. */
      top: 50%;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 340px;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    #onboarding-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84%;
      max-width: 300px;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      font-family: Arial, sans-serif;
      -webkit-app-region: no-drag;
    }

    #onboarding-overlay h2 {
      margin: 0 0 4px;
      font-size: 15px;
      color: #333;
      text-align: center;
    }

    #onboarding-overlay label {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
      display: block;
    }

    #onboarding-overlay input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
      color: #333;
      -webkit-app-region: no-drag;
    }

    #onboarding-overlay button {
      margin-top: 4px;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    #onboarding-overlay button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #onboarding-error {
      display: none;
      font-size: 11px;
      color: #e53935;
      text-align: center;
    }

    #chat-toolbar {
      display: none;
      position: absolute;
      bottom: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      max-width: 340px;
      align-items: center;
      justify-content: flex-end;
      -webkit-app-region: no-drag;
    }

    #settings-button {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      -webkit-app-region: no-drag;
    }

    #settings-overlay {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84%;
      max-width: 300px;
      flex-direction: column;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      font-family: Arial, sans-serif;
      -webkit-app-region: no-drag;
    }

    #settings-overlay h2 {
      margin: 0 0 4px;
      font-size: 15px;
      color: #333;
      text-align: center;
    }

    #settings-overlay label {
      font-size: 11px;
      color: #555;
      margin-bottom: 2px;
      display: block;
    }

    #settings-overlay input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
      color: #333;
      -webkit-app-region: no-drag;
    }

    #settings-usage {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #settings-usage-label {
      font-size: 12px;
      color: #555;
      text-align: center;
    }

    #settings-usage-track {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
    }

    #settings-usage-fill {
      height: 100%;
      width: 0%;
      background: #6c5ce7;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #settings-buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    #settings-buttons button {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    #settings-save {
      background: #6c5ce7;
      color: white;
    }

    #settings-save:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #settings-close {
      background: #eee;
      color: #333;
    }

    #settings-error {
      display: none;
      font-size: 11px;
      color: #e53935;
      text-align: center;
    }

    #mic-button {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
    }

    #mic-button.mic-active {
      background: #e53935;
      color: white;
      animation: mic-pulse 1s ease-in-out infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.6); }
      50% { box-shadow: 0 0 0 8px rgba(229, 57, 53, 0); }
    }

    #chat-input {
      box-sizing: border-box;
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      border: none;
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-size: 13px;
      font-family: Arial, sans-serif;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      -webkit-app-region: no-drag;
    }

  </style>

  <!--
    Electron renderer runs with nodeIntegration: false / contextIsolation: true,
    so it behaves like a plain browser page. "three" and "@pixiv/three-vrm" use
    bare module specifiers internally (e.g. `import * as THREE from "three"`),
    which the browser's ES module resolver cannot resolve on its own. This
    import map tells it where those bare specifiers point on disk, resolved
    relative to this HTML file's location (renderer/index.html).
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "../node_modules/three/build/three.module.js",
        "three/addons/": "../node_modules/three/examples/jsm/",
        "@pixiv/three-vrm": "../node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="character-canvas"></canvas>
  <div id="speech-bubble"></div>
  <div id="chat-toolbar">
    <button id="settings-button" type="button" aria-label="Settings">⚙️</button>
  </div>

  <div id="chat-container">
    <button id="mic-button" type="button" aria-label="Voice input">🎤</button>
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
  </div>

  <div id="settings-overlay">
    <h2>Settings</h2>
    <form id="settings-form">
      <label for="settings-name">Name</label>
      <input id="settings-name" type="text" autocomplete="off" required />
      <label for="settings-goal">Goal</label>
      <input id="settings-goal" type="text" autocomplete="off" required />
      <div id="settings-usage">
        <div id="settings-usage-label">-- / -- tokens today</div>
        <div id="settings-usage-track">
          <div id="settings-usage-fill"></div>
        </div>
      </div>
      <div id="settings-error"></div>
      <div id="settings-buttons">
        <button id="settings-close" type="button">Close</button>
        <button id="settings-save" type="submit">Save</button>
      </div>
    </form>
  </div>

  <div id="onboarding-overlay">
    <h2>Welcome! Let's get to know each other</h2>
    <form id="onboarding-form">
      <label for="onboarding-name">What should I call you?</label>
      <input id="onboarding-name" type="text" placeholder="Your name" autocomplete="off" required />
      <label for="onboarding-goal">What's your main goal with Boltmos?</label>
      <input id="onboarding-goal" type="text" placeholder="e.g. stay focused while studying" autocomplete="off" required />
      <div id="onboarding-error"></div>
      <button type="submit">Get started</button>
    </form>
  </div>

  <script type="module" src="./renderer.js"></script>

  <script>
    const speechBubble = document.getElementById('speech-bubble');
    let speechTimeout = null;

    // Duration is derived from the text itself (~50ms/char, clamped to a
    // 3-12s window) rather than a fixed value, so a short reply clears
    // quickly and a long one stays up long enough to actually read.
    const SPEECH_MS_PER_CHAR = 50;
    const SPEECH_MIN_DURATION_MS = 3000;
    const SPEECH_MAX_DURATION_MS = 12000;

    window.showSpeech = function showSpeech(text) {
      const duration = Math.min(
        SPEECH_MAX_DURATION_MS,
        Math.max(SPEECH_MIN_DURATION_MS, text.length * SPEECH_MS_PER_CHAR),
      );

      speechBubble.textContent = text;
      speechBubble.style.display = 'block';

      if (speechTimeout) {
        clearTimeout(speechTimeout);
      }

      speechTimeout = setTimeout(() => {
        speechBubble.style.display = 'none';
        speechTimeout = null;
      }, duration);
    };
  </script>
</body>
</html>
